# haproxy config for Lb01
# splits traffic between Web01 and Web02 so if one goes down the site stays up.
# swap WEB01_IP / WEB02_IP for the real internal IPs before using this.

global
    daemon
    maxconn 256

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend clickcheck_front
    bind *:80
    default_backend clickcheck_back

backend clickcheck_back
    # roundrobin = just alternate between the two servers, simplest option
    balance roundrobin
    # uses the app's own /health route to know if a server is actually alive,
    # not just whether the port is open
    option httpchk GET /health
    http-check expect status 200
    server web01 WEB01_IP:8080 check
    server web02 WEB02_IP:8080 check

# this page isn't required by the assignment, just useful while testing -
# shows both servers and whether haproxy thinks they're up.
# visit http://<Lb01_IP>:8404/stats
listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
